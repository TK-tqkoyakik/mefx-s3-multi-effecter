<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="820" viewBox="0 0 1045 820" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="820" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="26" fill="#202824" >ジャックの端子を特定する：電源OFF・基板から外す</text><text x="25" y="85" font-size="20" fill="#202824" >音声：ケーブルの片端をジャックへ挿し、反対端のプラグで調べる。</text><rect x="60" y="140" width="160" height="50" rx="5" fill="#333" stroke="#c6d3cb"/><rect x="220" y="150" width="220" height="30" rx="5" fill="#c9d0cc" stroke="#c6d3cb"/><path d="M440 150 L490 165 L440 180Z" fill="#c9d0cc"/><path d="M423 150 V180" stroke="#222" stroke-width="6"/><polyline points="300,170 85,240" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="300,170 85,240" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/><circle cx="300" cy="170" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="93" y="240" font-size="19" fill="#333" >SLEEVE：金属の長い部分</text><polyline points="467,165 480,310" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="467,165 480,310" fill="none" stroke="#176bc0" stroke-width="4" stroke-linejoin="round"/><circle cx="467" cy="165" r="9" fill="#176bc0" stroke="white" stroke-width="2"/><text x="488" y="310" font-size="19" fill="#176bc0" >TIP：金属の先端</text><text x="60" y="125" font-size="20" fill="#202824" >露出している反対端のTSプラグ</text><text x="60" y="325" font-size="19" fill="#923228" >黒いグリップ部分には当てない。</text><rect x="700" y="130" width="300" height="200" rx="5" fill="#f3f7f4" stroke="#c6d3cb"/><text x="715" y="165" font-size="20" fill="#202824" >ジャック側の候補端子</text><circle cx="750" cy="205" r="9" fill="#555" stroke="white" stroke-width="2"/><text x="775" y="211" font-size="19" fill="#202824" >候補 a</text><circle cx="750" cy="250" r="9" fill="#555" stroke="white" stroke-width="2"/><text x="775" y="256" font-size="19" fill="#202824" >候補 b</text><circle cx="750" cy="295" r="9" fill="#555" stroke="white" stroke-width="2"/><text x="775" y="301" font-size="19" fill="#202824" >候補 c</text><polyline points="467,165 540,165 540,205 750,205" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="467,165 540,165 540,205 750,205" fill="none" stroke="#176bc0" stroke-width="4" stroke-linejoin="round"/><text x="540" y="245" font-size="19" fill="#202824" >導通測定</text><text x="540" y="275" font-size="19" fill="#202824" >1本ずつ</text><text x="25" y="370" font-size="21" fill="#202824" >TIPと導通 → J2-1 / J5-1。SLEEVEと導通 → J2-2 / J5-2。</text><text x="25" y="405" font-size="19" fill="#923228" >候補a/b/cの位置は仮。端子の形・本数・並びから決めない。</text><text x="25" y="470" font-size="20" fill="#202824" >DC：電源につながっていない適合プラグをジャックへ挿して調べる。</text><circle cx="155" cy="575" r="47" fill="none" stroke="#bc3038" stroke-width="13"/><circle cx="155" cy="575" r="14" fill="#333"/><polyline points="200,575 290,535" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="200,575 290,535" fill="none" stroke="#bc3038" stroke-width="4" stroke-linejoin="round"/><circle cx="200" cy="575" r="9" fill="#bc3038" stroke="white" stroke-width="2"/><text x="298" y="535" font-size="19" fill="#bc3038" >外周金属 → 導通する端子をJ1-1へ</text><polyline points="155,575 290,625" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="155,575 290,625" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/><circle cx="155" cy="575" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="298" y="625" font-size="19" fill="#333" >中心接点 → 導通する端子をJ1-2へ</text><text x="25" y="695" font-size="20" fill="#923228" >アダプターのACプラグは抜く。導通測定は必ず無通電で行う。</text><text x="25" y="735" font-size="19" fill="#202824" >予備の無通電プラグ等で接点を確実に測れない場合は、端子を推測しない。</text><text x="25" y="775" font-size="19" fill="#202824" >3本目などの切替接点は未使用。同じ接点が複数見つかる場合は型番で確認。</text></svg>