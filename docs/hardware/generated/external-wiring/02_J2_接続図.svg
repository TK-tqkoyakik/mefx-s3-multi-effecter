<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="625" viewBox="0 0 1045 625" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="625" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="28" fill="#202824" font-weight="700">J2  INPUT / 楽器から</text><text x="25" y="80" font-size="20" fill="#202824" >ギター・ベース → シールドケーブル → INPUT</text><rect x="25" y="115" width="240" height="270" rx="5" fill="#edf5ef" stroke="#c6d3cb"/><rect x="560" y="115" width="460" height="270" rx="5" fill="#f4f6f5" stroke="#c6d3cb"/><text x="42" y="149" font-size="22" fill="#202824" >基板側の穴</text><text x="580" y="149" font-size="21" fill="#202824" >6.35mm TS モノラルジャック</text><polyline points="240,208 585,208" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,208 585,208" fill="none" stroke="#176bc0" stroke-width="4" stroke-linejoin="round"/><rect x="231" y="199" width="18" height="18" fill="#176bc0" stroke="white" stroke-width="2"/><text x="240" y="213" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="585" cy="208" r="9" fill="#176bc0" stroke="white" stroke-width="2"/><text x="42" y="198" font-size="22" fill="#202824" font-weight="700">J2-1</text><text x="42" y="226" font-size="16" fill="#202824" >INPUT_TIP</text><text x="610" y="215" font-size="20" fill="#202824" >TIP：プラグの先端と導通</text><polyline points="240,278 585,278" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,278 585,278" fill="none" stroke="#333333" stroke-width="4" stroke-linejoin="round"/><circle cx="240" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="240" y="283" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="585" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="42" y="268" font-size="22" fill="#202824" font-weight="700">J2-2</text><text x="42" y="296" font-size="16" fill="#202824" >GND</text><text x="610" y="285" font-size="20" fill="#202824" >SLEEVE：プラグの根元と導通</text><text x="26" y="423" font-size="19" fill="#202824" >基板の穴の並び（部品面から。左右は全体図と同じ）</text><rect x="51" y="451" width="18" height="18" fill="#176bc0" stroke="white" stroke-width="2"/><text x="60" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="165" cy="460" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="165" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><rect x="565" y="434" width="145" height="35" rx="5" fill="#333333" stroke="#c6d3cb"/><rect x="710" y="439" width="130" height="25" rx="5" fill="#cad1ce" stroke="#c6d3cb"/><path d="M840 439 L880 450 L840 464Z" fill="#cad1ce"/><path d="M819 439V464" stroke="#222" stroke-width="5"/><polyline points="760,450 760,490 585,490" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="760,450 760,490 585,490" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/><circle cx="760" cy="450" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="580" y="520" font-size="18" fill="#202824" >長い金属部＝SLEEVE</text><polyline points="863,450 920,485" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="863,450 920,485" fill="none" stroke="#176bc0" stroke-width="4" stroke-linejoin="round"/><text x="840" y="520" font-size="18" fill="#202824" >先端＝TIP</text><text x="25" y="566" font-size="19" fill="#923228" >プラグをジャックに挿し、電源OFFで導通を調べる。</text><text x="25" y="600" font-size="19" fill="#923228" >ジャックの端子を左右や長さだけで決めない。</text></svg>