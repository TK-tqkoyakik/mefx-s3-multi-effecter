<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="625" viewBox="0 0 1045 625" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="625" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="28" fill="#202824" font-weight="700">U5  R-78 / 9Vから5Vへ</text><text x="25" y="80" font-size="20" fill="#202824" >R-78も基板へ挿さず、3本の線でつなぐ</text><rect x="25" y="115" width="240" height="270" rx="5" fill="#edf5ef" stroke="#c6d3cb"/><rect x="560" y="115" width="460" height="270" rx="5" fill="#f4f6f5" stroke="#c6d3cb"/><text x="42" y="149" font-size="22" fill="#202824" >基板側の穴</text><text x="580" y="149" font-size="21" fill="#202824" >RECOM R-78E5.0-1.0</text><polyline points="240,208 585,208" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,208 585,208" fill="none" stroke="#bc3038" stroke-width="4" stroke-linejoin="round"/><rect x="231" y="199" width="18" height="18" fill="#bc3038" stroke="white" stroke-width="2"/><text x="240" y="213" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="585" cy="208" r="9" fill="#bc3038" stroke="white" stroke-width="2"/><text x="42" y="198" font-size="22" fill="#202824" font-weight="700">U5-1</text><text x="42" y="226" font-size="16" fill="#202824" >+9V_PROT</text><text x="610" y="215" font-size="20" fill="#202824" >Pin 1 / VIN</text><polyline points="240,278 585,278" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,278 585,278" fill="none" stroke="#333333" stroke-width="4" stroke-linejoin="round"/><circle cx="240" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="240" y="283" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="585" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="42" y="268" font-size="22" fill="#202824" font-weight="700">U5-2</text><text x="42" y="296" font-size="16" fill="#202824" >GND</text><text x="610" y="285" font-size="20" fill="#202824" >Pin 2 / GND</text><polyline points="240,348 585,348" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,348 585,348" fill="none" stroke="#a66a0a" stroke-width="4" stroke-linejoin="round"/><circle cx="240" cy="348" r="9" fill="#a66a0a" stroke="white" stroke-width="2"/><text x="240" y="353" font-size="13" fill="white" text-anchor="middle" font-weight="700">3</text><circle cx="585" cy="348" r="9" fill="#a66a0a" stroke="white" stroke-width="2"/><text x="42" y="338" font-size="22" fill="#202824" font-weight="700">U5-3</text><text x="42" y="366" font-size="16" fill="#202824" >+5V</text><text x="610" y="355" font-size="20" fill="#202824" >Pin 3 / VOUT（5V）</text><text x="26" y="423" font-size="19" fill="#202824" >基板の穴の並び（部品面から。左右は全体図と同じ）</text><rect x="51" y="451" width="18" height="18" fill="#bc3038" stroke="white" stroke-width="2"/><text x="60" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="165" cy="460" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="165" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="270" cy="460" r="9" fill="#a66a0a" stroke="white" stroke-width="2"/><text x="270" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">3</text><text x="565" y="452" font-size="18" fill="#202824" >印字面を手前、足を下。左から1・2・3。</text><text x="565" y="484" font-size="18" fill="#202824" >別図「R-78の向きと3本の足」で照合。</text><text x="25" y="566" font-size="19" fill="#923228" >足ごとに熱収縮チューブ等で絶縁し、本体を固定する。</text><text x="25" y="600" font-size="19" fill="#923228" >配線はできるだけ短く。延長による安定性・ノイズは実機確認。</text></svg>