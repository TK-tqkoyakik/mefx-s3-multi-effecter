<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="625" viewBox="0 0 1045 625" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="625" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="28" fill="#202824" font-weight="700">J1  9V電源 / センターマイナス</text><text x="25" y="80" font-size="20" fill="#202824" >9V DCアダプター → DCジャック → J1</text><rect x="25" y="115" width="240" height="270" rx="5" fill="#edf5ef" stroke="#c6d3cb"/><rect x="560" y="115" width="460" height="270" rx="5" fill="#f4f6f5" stroke="#c6d3cb"/><text x="42" y="149" font-size="22" fill="#202824" >基板側の穴</text><text x="580" y="149" font-size="21" fill="#202824" >DCジャック（機能で端子を特定）</text><polyline points="240,208 585,208" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,208 585,208" fill="none" stroke="#bc3038" stroke-width="4" stroke-linejoin="round"/><rect x="231" y="199" width="18" height="18" fill="#bc3038" stroke="white" stroke-width="2"/><text x="240" y="213" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="585" cy="208" r="9" fill="#bc3038" stroke="white" stroke-width="2"/><text x="42" y="198" font-size="22" fill="#202824" font-weight="700">J1-1</text><text x="42" y="226" font-size="16" fill="#202824" >+9V_RAW</text><text x="610" y="215" font-size="20" fill="#202824" >プラグ外周と導通する端子（＋）</text><polyline points="240,278 585,278" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,278 585,278" fill="none" stroke="#333333" stroke-width="4" stroke-linejoin="round"/><circle cx="240" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="240" y="283" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="585" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="42" y="268" font-size="22" fill="#202824" font-weight="700">J1-2</text><text x="42" y="296" font-size="16" fill="#202824" >GND</text><text x="610" y="285" font-size="20" fill="#202824" >プラグ中心と導通する端子（−）</text><text x="26" y="423" font-size="19" fill="#202824" >基板の穴の並び（部品面から。左右は全体図と同じ）</text><rect x="51" y="451" width="18" height="18" fill="#bc3038" stroke="white" stroke-width="2"/><text x="60" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="165" cy="460" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="165" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="750" cy="465" r="30" fill="none" stroke="#bc3038" stroke-width="9"/><circle cx="750" cy="465" r="9" fill="#333333"/><text x="590" y="523" font-size="20" fill="#202824" >プラグ外周 ＋ ／ 中心 −</text><text x="25" y="566" font-size="19" fill="#923228" >未通電のプラグを挿して、中心・外周との導通を確認。</text><text x="25" y="600" font-size="19" fill="#923228" >3本目のスイッチ端子は未接続。USBと9Vは同時接続しない。</text></svg>