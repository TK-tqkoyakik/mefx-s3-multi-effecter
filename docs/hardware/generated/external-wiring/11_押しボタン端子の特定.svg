<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="820" viewBox="0 0 1045 820" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="820" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="28" fill="#202824" >4本足の押しボタン：使うのは2つの接点</text><text x="25" y="80" font-size="20" fill="#202824" >向きや対角線で決めず、基板につなぐ前にテスターで調べる。</text><rect x="330" y="130" width="360" height="280" rx="5" fill="#e5eae7" stroke="#c6d3cb"/><circle cx="510" cy="270" r="70" fill="#555"/><circle cx="300" cy="180" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="300" y="185" font-size="13" fill="white" text-anchor="middle" font-weight="700">a</text><text x="300" y="155" font-size="21" fill="#202824" text-anchor="middle">候補 a</text><circle cx="720" cy="180" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="720" y="185" font-size="13" fill="white" text-anchor="middle" font-weight="700">b</text><text x="720" y="155" font-size="21" fill="#202824" text-anchor="middle">候補 b</text><circle cx="300" cy="360" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="300" y="365" font-size="13" fill="white" text-anchor="middle" font-weight="700">c</text><text x="300" y="335" font-size="21" fill="#202824" text-anchor="middle">候補 c</text><circle cx="720" cy="360" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="720" y="365" font-size="13" fill="white" text-anchor="middle" font-weight="700">d</text><text x="720" y="335" font-size="21" fill="#202824" text-anchor="middle">候補 d</text><text x="25" y="470" font-size="23" fill="#202824" >1. 任意の2本にプローブを当てる。</text><text x="25" y="520" font-size="23" fill="#202824" >2. 離した状態では導通しないことを確認。</text><text x="25" y="570" font-size="23" fill="#202824" >3. 押したときだけ導通する2本を採用。</text><text x="25" y="630" font-size="21" fill="#202824" >採用した一方 → J4-1、もう一方 → J4-2。極性はありません。</text><text x="25" y="680" font-size="20" fill="#923228" >押さなくても常に導通する組合せは使わない。残りの足は未接続。</text><text x="25" y="730" font-size="19" fill="#202824" >a〜dは確認用の仮名。内部の接続や実物の足位置を表していません。</text></svg>