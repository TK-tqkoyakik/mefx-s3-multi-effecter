<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="820" viewBox="0 0 1045 820" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="820" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="28" fill="#202824" >R-78：印字面を手前、足を下にする</text><text x="25" y="80" font-size="20" fill="#202824" >R-78E5.0-1.0 専用。型番が違う場合は、この足順を使わない。</text><rect x="250" y="130" width="420" height="270" rx="5" fill="#252c2b" stroke="#c6d3cb"/><text x="460" y="215" font-size="30" fill="white" text-anchor="middle">RECOM</text><text x="460" y="270" font-size="28" fill="white" text-anchor="middle">R-78E5.0-1.0</text><text x="460" y="320" font-size="21" fill="white" text-anchor="middle">型番の印字が読める面</text><circle cx="310" cy="365" r="9" fill="white" stroke="white" stroke-width="2"/><text x="700" y="355" font-size="20" fill="#202824" >左のマーク側が1番</text><polyline points="310,365 690,365" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="310,365 690,365" fill="none" stroke="#777" stroke-width="4" stroke-linejoin="round"/><rect x="301" y="400" width="18" height="85" rx="5" fill="#c4ccca" stroke="#c6d3cb"/><polyline points="310,485 310,600" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="310,485 310,600" fill="none" stroke="#bc3038" stroke-width="4" stroke-linejoin="round"/><circle cx="310" cy="485" r="9" fill="#bc3038" stroke="white" stroke-width="2"/><text x="310" y="490" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><text x="310" y="640" font-size="24" fill="#bc3038" text-anchor="middle">1 / VIN</text><text x="310" y="680" font-size="22" fill="#bc3038" text-anchor="middle">基板 U5-1へ</text><rect x="451" y="400" width="18" height="85" rx="5" fill="#c4ccca" stroke="#c6d3cb"/><polyline points="460,485 460,600" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="460,485 460,600" fill="none" stroke="#333333" stroke-width="4" stroke-linejoin="round"/><circle cx="460" cy="485" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="460" y="490" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><text x="460" y="640" font-size="24" fill="#333333" text-anchor="middle">2 / GND</text><text x="460" y="680" font-size="22" fill="#333333" text-anchor="middle">基板 U5-2へ</text><rect x="601" y="400" width="18" height="85" rx="5" fill="#c4ccca" stroke="#c6d3cb"/><polyline points="610,485 610,600" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="610,485 610,600" fill="none" stroke="#a66a0a" stroke-width="4" stroke-linejoin="round"/><circle cx="610" cy="485" r="9" fill="#a66a0a" stroke="white" stroke-width="2"/><text x="610" y="490" font-size="13" fill="white" text-anchor="middle" font-weight="700">3</text><text x="610" y="640" font-size="24" fill="#a66a0a" text-anchor="middle">3 / VOUT</text><text x="610" y="680" font-size="22" fill="#a66a0a" text-anchor="middle">基板 U5-3へ</text><text x="25" y="735" font-size="20" fill="#923228" >背面から見ると左右が逆になります。3本それぞれを絶縁してから固定。</text><text x="25" y="775" font-size="18" fill="#202824" >RECOM仕様書 4ページの外形・ピン表に基づく模式図。現物の型番とマークも照合。</text></svg>