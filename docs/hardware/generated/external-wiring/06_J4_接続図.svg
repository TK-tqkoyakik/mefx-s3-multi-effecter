<svg xmlns="http://www.w3.org/2000/svg" width="1045" height="625" viewBox="0 0 1045 625" font-family="Meiryo, Yu Gothic UI, sans-serif"><rect x="0" y="0" width="1045" height="625" rx="5" fill="white" stroke="white"/><text x="25" y="42" font-size="28" fill="#202824" font-weight="700">J4  押しボタン / エフェクト切替</text><text x="25" y="80" font-size="20" fill="#202824" >J4の2本 → 押しボタンの接点A・B</text><rect x="25" y="115" width="240" height="270" rx="5" fill="#edf5ef" stroke="#c6d3cb"/><rect x="560" y="115" width="460" height="270" rx="5" fill="#f4f6f5" stroke="#c6d3cb"/><text x="42" y="149" font-size="22" fill="#202824" >基板側の穴</text><text x="580" y="149" font-size="21" fill="#202824" >押した時だけONになる接点</text><polyline points="240,208 585,208" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,208 585,208" fill="none" stroke="#896e10" stroke-width="4" stroke-linejoin="round"/><rect x="231" y="199" width="18" height="18" fill="#896e10" stroke="white" stroke-width="2"/><text x="240" y="213" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="585" cy="208" r="9" fill="#896e10" stroke="white" stroke-width="2"/><text x="42" y="198" font-size="22" fill="#202824" font-weight="700">J4-1</text><text x="42" y="226" font-size="16" fill="#202824" >FOOTSW_GPIO</text><text x="610" y="215" font-size="20" fill="#202824" >接点A（極性なし）</text><polyline points="240,278 585,278" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/><polyline points="240,278 585,278" fill="none" stroke="#333333" stroke-width="4" stroke-linejoin="round"/><circle cx="240" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="240" y="283" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="585" cy="278" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="42" y="268" font-size="22" fill="#202824" font-weight="700">J4-2</text><text x="42" y="296" font-size="16" fill="#202824" >GND</text><text x="610" y="285" font-size="20" fill="#202824" >接点B（極性なし）</text><text x="26" y="423" font-size="19" fill="#202824" >基板の穴の並び（部品面から。左右は全体図と同じ）</text><rect x="51" y="451" width="18" height="18" fill="#896e10" stroke="white" stroke-width="2"/><text x="60" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="165" cy="460" r="9" fill="#333333" stroke="white" stroke-width="2"/><text x="165" y="465" font-size="13" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="640" cy="460" r="7" fill="#333"/><circle cx="850" cy="460" r="7" fill="#333"/><path d="M640 460 L800 418" stroke="#333" stroke-width="4"/><text x="610" y="518" font-size="20" fill="#202824" >離す：OFF ／ 押す：ON</text><text x="25" y="566" font-size="19" fill="#923228" >4本足でも、未押下で非導通・押下時だけ導通する2本を使う。</text><text x="25" y="600" font-size="19" fill="#923228" >常に導通する2本は不可。残り2本はつながない。</text></svg>