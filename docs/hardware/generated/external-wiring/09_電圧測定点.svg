 font-size="21" fill="#202824" >C7</text><circle cx="842" cy="277" r="9" fill="#7858a6" stroke="white" stroke-width="2"/><text x="842" y="282" font-size="13" fill="white" text-anchor="middle" font-weight="700">C</text><circle cx="926" cy="277" r="9" fill="#333" stroke="white" stroke-width="2"/><text x="805" y="345" font-size="20" fill="#7858a6" >左端＝3.3V</text><text x="805" y="375" font-size="20" fill="#202824" >右端＝GND</text><text x="575" y="482" font-size="19" fill="#923228" >C7の両端をプローブで橋渡ししない。</text><text x="25" y="530" font-size="23" fill="#bc3038" >A：赤 → U3-1（上列の左端）　約5V</text><text x="25" y="575" font-size="23" fill="#202824" >B：黒 → U3-21（下列の左端）　共通GND</text><text x="25" y="620" font-size="23" fill="#7858a6" >C：赤 → C7の左端　　　　　　 約3.3V</text><text x="25" y="675" font-size="20" fill="#202824" >先に電源OFFで黒プローブを固定。DC電圧モードにしてから9Vを接続。</text><text x="25" y="715" font-size="20" fill="#923228" >赤リードはV/Ω端子、黒はCOM。電流端子・電流モードでは測らない。</text><text x="25" y="755" font-size="20" fill="#923228" >C7は小さいため、安定して当てられない場合は通電せず作業を止める。</text></svg>