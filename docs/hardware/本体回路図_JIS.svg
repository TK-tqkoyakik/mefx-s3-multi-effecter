<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <style>
      .sheet { fill: #ffffff; }
      .frame { fill: none; stroke: #111; stroke-width: 2; }
      .grid { stroke: #f1f1f1; stroke-width: 1; }
      .wire { stroke: #111; stroke-width: 2.2; fill: none; stroke-linecap: square; stroke-linejoin: round; }
      .thin { stroke: #111; stroke-width: 1.6; fill: none; }
      .symbol { stroke: #111; stroke-width: 2.2; fill: #ffffff; }
      .ic { stroke: #111; stroke-width: 2.2; fill: #ffffff; }
      .label { font: 700 22px "Segoe UI", "Noto Sans JP", sans-serif; fill: #111; }
      .sub { font: 15px "Segoe UI", "Noto Sans JP", sans-serif; fill: #222; }
      .txt { font: 18px "Segoe UI", "Noto Sans JP", sans-serif; fill: #111; }
      .small { font: 14px "Segoe UI", "Noto Sans JP", sans-serif; fill: #111; }
      .tiny { font: 12px "Segoe UI", "Noto Sans JP", sans-serif; fill: #111; }
      .net { font: 700 14px "Consolas", "Segoe UI", sans-serif; fill: #111; }
      .ref { font: 700 16px "Consolas", "Segoe UI", sans-serif; fill: #111; }
      .value { font: 14px "Consolas", "Segoe UI", sans-serif; fill: #111; }
      .section { font: 700 20px "Segoe UI", "Noto Sans JP", sans-serif; fill: #111; }
      .box-title { font: 700 18px "Segoe UI", "Noto Sans JP", sans-serif; fill: #111; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M40 0H0V40"/>
    </pattern>

    <g id="gnd">
      <path class="wire" d="M0 0 V10"/>
      <path class="wire" d="M-18 10 H18"/>
      <path class="wire" d="M-12 17 H12"/>
      <path class="wire" d="M-6 24 H6"/>
    </g>

    <g id="pwr">
      <path class="wire" d="M0 28 V0"/>
      <path class="wire" d="M-12 12 L0 0 L12 12"/>
    </g>

    <g id="res-h">
      <path class="wire" d="M0 20 H24"/>
      <rect class="symbol" x="24" y="8" width="72" height="24"/>
      <path class="wire" d="M96 20 H120"/>
    </g>

    <g id="res-v">
      <path class="wire" d="M20 0 V24"/>
      <rect class="symbol" x="8" y="24" width="24" height="72"/>
      <path class="wire" d="M20 96 V120"/>
    </g>

    <g id="cap-h">
      <path class="wire" d="M0 20 H48"/>
      <path class="wire" d="M48 0 V40"/>
      <path class="wire" d="M72 0 V40"/>
      <path class="wire" d="M72 20 H120"/>
    </g>

    <g id="cap-v">
      <path class="wire" d="M20 0 V48"/>
      <path class="wire" d="M0 48 H40"/>
      <path class="wire" d="M0 72 H40"/>
      <path class="wire" d="M20 72 V120"/>
    </g>

    <g id="diode-h">
      <path class="wire" d="M0 20 H36"/>
      <path class="symbol" d="M36 0 L76 20 L36 40 Z"/>
      <path class="wire" d="M82 0 V40"/>
      <path class="wire" d="M82 20 H120"/>
    </g>

    <g id="opamp">
      <path class="symbol" d="M0 0 L0 150 L190 75 Z"/>
      <text class="txt" x="16" y="56">+</text>
      <text class="txt" x="18" y="110">−</text>
    </g>

    <g id="jack">
      <circle class="symbol" cx="40" cy="40" r="32"/>
      <path class="wire" d="M40 8 V-15"/>
      <path class="wire" d="M40 72 V95"/>
      <path class="thin" d="M20 40 H60"/>
    </g>
  </defs>

  <rect class="sheet" x="0" y="0" width="2400" height="1600"/>
  <rect x="0" y="0" width="2400" height="1600" fill="url(#grid)" opacity="0.08"/>
  <rect class="frame" x="35" y="35" width="2330" height="1530"/>

  <text class="label" x="70" y="85">MEFX-S3 Multi Effecter 本体回路図 v2（JIS/IEC風記号）</text>
  <text class="sub" x="70" y="112">抵抗=長方形、コンデンサ=平行板、GND/電源記号、オペアンプ三角記号、IC=ピン付き矩形。試作向けの読みやすさ優先。</text>
  <text class="sub" x="70" y="136">コンデンサ種類: 10nF/100nF=セラミック50V、1uF=フィルム50V、10uF/47uF/100uF=電解16V以上。</text>

